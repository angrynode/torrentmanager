{% if let Some(flash) = flash %}
  <div class="alert {% if flash.success %}alert-success{% else %}alert-danger{% endif %} mt-4">
    {% for message in flash.message.messages() %}
    {% let mut lines = message.split("\n") %}
    <p class="mb-0">
      {{ lines.next().unwrap() }}
      {% for msg in lines %}
        <br>-> {{ msg }}
      {% endfor %}
    </p>
    {% endfor %}
  </div>
{% endif %}
